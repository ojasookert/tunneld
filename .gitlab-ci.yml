image: docker:latest
services:
  - docker:dind

stages:
  - test
  - build
  - release

variables:
  COMMIT_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

test:
  stage: test
  image: rust:1.95-bookworm
  before_script:
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test
  except:
    - tags

build:
  stage: build
  before_script:
    - until docker info; do sleep 1; done
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $COMMIT_IMAGE -t $CI_REGISTRY_IMAGE:latest .
    - docker push --all-tags $CI_REGISTRY_IMAGE
  except:
    - tags

release:
  stage: release
  before_script:
    - until docker info; do sleep 1; done
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $COMMIT_IMAGE
    - docker tag $COMMIT_IMAGE $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  only:
    - tags
